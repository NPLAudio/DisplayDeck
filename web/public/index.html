<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DisplayDeck</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<main>
  <div class="row" style="flex-wrap:wrap; margin-bottom:4px">
    <a class="btn outline sm" href="/editor" id="newLayoutLink" title="Build a layout by arranging your displays" hidden>New layout</a>
    <button class="btn outline sm" type="button" id="saveLayoutBtn" title="Save the current display layout as a profile">Save layout</button>
    <button class="btn ghost sm" type="button" id="undoBtn" title="Go back to the layout before the last change">Undo</button>
    <span class="grow"></span>
    <button class="btn ghost sm" type="button" id="toggleAll">Expand all</button>
  </div>
  <p id="status" class="status" role="status"></p>
  <div id="profiles" class="stack"></div>

  <details class="card section" id="devicesSection" style="margin-top:16px">
    <summary>
      <span>Audio devices <span id="liveDot" class="muted small" style="font-weight:400"></span></span>
      <span id="devicesChev"></span>
    </summary>
    <div class="section-body" id="devices"></div>
  </details>
</main>

<dialog id="saveDlg">
  <form method="dialog" id="saveForm">
    <h2>Save the current layout</h2>
    <p class="card-description">Saves the displays that are on right now (arrangement, resolution, refresh rate) as a profile.</p>
    <div class="field" style="margin-top:16px">
      <label class="label" for="saveName">Profile name</label>
      <input class="input" id="saveName" autocomplete="off" maxlength="60" placeholder="Desk, Living Room, ...">
    </div>
    <p id="saveMsg" class="status err" role="status"></p>
    <div class="dialog-footer">
      <button type="button" class="btn outline" id="saveCancel">Cancel</button>
      <button type="button" class="btn destructive" id="saveReplace" hidden>Replace existing</button>
      <button type="submit" class="btn" id="saveGo">Save</button>
    </div>
  </form>
</dialog>

<dialog id="audioDlg">
  <form method="dialog" id="audioForm">
    <h2 id="dlgTitle">Audio</h2>
    <p class="card-description">Applied together with the layout when you tap the profile.</p>
    <div class="field" style="margin-top:16px">
      <label class="label" for="dlgDevice">Playback device</label>
      <select class="input" id="dlgDevice"></select>
    </div>
    <div class="field">
      <label class="label" for="dlgSpatial">Spatial sound</label>
      <select class="input" id="dlgSpatial"></select>
      <input class="input" id="dlgCustom" placeholder="Format name or GUID" style="margin-top:8px" hidden>
    </div>
    <p id="dlgMsg" class="status err" role="status"></p>
    <div class="dialog-footer">
      <button type="button" class="btn ghost destructive" id="dlgClear">Remove</button>
      <span class="grow"></span>
      <button type="button" class="btn outline" id="dlgCancel">Cancel</button>
      <button type="button" class="btn secondary" id="dlgSave">Save</button>
      <button type="button" class="btn" id="dlgApply">Save &amp; apply</button>
    </div>
  </form>
</dialog>

<script src="/app.js"></script>
<script>
const state = { liveMatched: false, profiles: [], busy: false, canEdit: false, devices: [] };

const fmtHz = (h) => (h == null ? '' : `@${Number.isInteger(h) ? h : h.toFixed(2).replace(/0+$/, '')} Hz`);
const fmtRes = (d) => (d.width ? `${d.width}×${d.height}` : '?');
const spatialLabel = (s) => (s == null ? null : /^(|off|none)$/i.test(s) ? 'Spatial off' : s);

// ---------- to-scale layout preview ----------
function layoutSvg(displays) {
  const act = displays.filter((d) => d.x != null && d.width);
  if (!act.length) return null;
  const x0 = Math.min(...act.map((d) => d.x)), y0 = Math.min(...act.map((d) => d.y));
  const w = Math.max(...act.map((d) => d.x + d.width)) - x0, h = Math.max(...act.map((d) => d.y + d.height)) - y0;
  const W = 320, pad = 4, s = (W - pad * 2) / w, H = Math.max(h * s + pad * 2, 40);
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('class', 'layout');
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', 'Display layout');
  const mk = (tag, attrs, text) => {
    const n = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
    if (text != null) n.textContent = text;
    return n;
  };
  for (const d of act) {
    const rx = pad + (d.x - x0) * s, ry = pad + (d.y - y0) * s, rw = d.width * s, rh = d.height * s;
    svg.append(mk('rect', { x: rx + 1, y: ry + 1, width: rw - 2, height: rh - 2, rx: 4, class: d.primary ? 'mon pri' : 'mon' }));
    const max = Math.max(4, Math.floor((rw - 8) / 6.5));
    const label = (d.primary ? '★ ' : '') + (d.name.length > max ? d.name.slice(0, max - 1) + '…' : d.name);
    svg.append(mk('text', { x: rx + rw / 2, y: ry + rh / 2 - 1, 'text-anchor': 'middle' }, label));
    svg.append(mk('text', { x: rx + rw / 2, y: ry + rh / 2 + 12, 'text-anchor': 'middle', class: 'sub' }, `${fmtRes(d)}${fmtHz(d.refreshHz)}`));
  }
  return svg;
}

// ---------- profile cards: tap the header to apply, use the chevron to expand ----------
function summaryOf(p) {
  if (p.error) return 'Could not read this profile';
  const names = p.displays.map((d) => d.name).join(' + ') || 'No displays';
  const primary = p.displays.find((d) => d.primary) || p.displays[0];
  const res = primary ? ` · ${fmtRes(primary)}${fmtHz(primary.refreshHz)}` : '';
  const a = p.audio && !p.audio.error ? p.audio : null;
  return names + res + (a && (a.label || a.device) ? ` · ${a.label || 'Audio set'}` : '');
}

function profileCard(p) {
  const isCurrent = p.current || (p.lastApplied && !state.liveMatched);
  let open = prefs.get('open.' + p.name, false);

  const badges = [];
  if (p.current) badges.push(el('span', { class: 'badge' }, 'Current'));
  else if (p.lastApplied) badges.push(el('span', { class: 'badge outline' }, 'Last applied'));

  const applyBtn = el('button', { class: 'profile-apply', type: 'button', onclick: () => applyProfile(p.name, card) },
    el('div', { class: 'profile-name' }, p.name, ...badges),
    el('div', { class: 'profile-summary' }, summaryOf(p)));

  const chev = icon('chevron', 'chev');
  const toggle = el('button', { class: 'btn ghost icon sm', type: 'button', 'aria-expanded': String(open), 'aria-label': `Details for ${p.name}` }, chev);

  const body = el('div', { class: 'profile-body', hidden: !open });
  if (p.error) {
    body.append(el('div', { class: 'alert error' }, icon('alert'), `Couldn't read this profile (${p.error}). Tapping it still tries to apply it.`));
  } else {
    const svg = layoutSvg(p.displays);
    if (svg) body.append(svg);
    body.append(el('ul', { class: 'plain' },
      p.displays.map((d) => el('li', {}, `${d.primary ? '★ ' : ''}${d.name} — ${fmtRes(d)} ${fmtHz(d.refreshHz)}`.trim())),
      p.disabled.map((d) => el('li', { class: 'off' }, `${d.name} — off`))));
    if (p.warnings.length) body.append(el('div', { class: 'alert warn' }, icon('alert'), p.warnings.join('; ')));
  }
  const a = p.audio;
  const audioText = !a ? 'No audio set' : a.error ? `audio.json unreadable: ${a.error}`
    : `${a.label || a.device || 'No device chosen'}${spatialLabel(a.spatial) ? ' · ' + spatialLabel(a.spatial) : ''}`;
  body.append(el('div', { class: 'row between' },
    el('span', { class: 'row muted grow', style: 'min-width:0' }, icon('volume'), el('span', {}, audioText)),
    el('button', { class: 'btn outline sm', type: 'button', onclick: () => openAudio(p) }, 'Edit audio')));
  if (state.canEdit) {
    body.append(el('div', { class: 'row', style: 'flex-wrap:wrap' },
      el('a', { class: 'btn outline sm', href: '/editor?from=' + encodeURIComponent(p.name) }, icon('layout'), 'Edit layout'),
      el('button', { class: 'btn ghost destructive sm', type: 'button', onclick: () => deleteProfile(p.name) }, icon('trash'), 'Delete profile')));
  }

  toggle.addEventListener('click', () => {
    open = !open;
    body.hidden = !open;
    toggle.setAttribute('aria-expanded', String(open));
    prefs.set('open.' + p.name, open);
    syncToggleAll();
  });

  const card = el('div', { class: 'card' + (isCurrent ? ' current' : ''), 'data-name': p.name },
    el('div', { class: 'profile-head' }, applyBtn, el('div', { class: 'profile-toggle' }, toggle)), body);
  return card;
}

function syncToggleAll() {
  const names = state.profiles.map((p) => p.name);
  const allOpen = names.length > 0 && names.every((n) => prefs.get('open.' + n, false));
  $('toggleAll').textContent = allOpen ? 'Collapse all' : 'Expand all';
  $('toggleAll').hidden = names.length === 0;
}
$('toggleAll').addEventListener('click', () => {
  const allOpen = state.profiles.every((p) => prefs.get('open.' + p.name, false));
  state.profiles.forEach((p) => prefs.set('open.' + p.name, !allOpen));
  renderProfiles();
});

function renderProfiles() {
  $('profiles').replaceChildren(...state.profiles.map(profileCard));
  if (!state.profiles.length) {
    $('profiles').append(el('div', { class: 'card' }, el('div', { class: 'card-content muted' }, 'No saved layouts yet. Arrange your displays the way you want, then press "Save current layout".')));
  }
  syncToggleAll();
}

async function loadProfiles() {
  try {
    const { profiles, live } = await api('/api/profiles');
    state.profiles = profiles; state.liveMatched = live.matched;
    renderProfiles();
    setStatus(live.available
      ? (live.matched ? 'The live display state matches the highlighted profile.' : 'The live display state matches no saved profile; showing the last applied one.')
      : 'Could not read the live display state; showing the last applied profile.');
    renderDevices();
  } catch (e) { setStatus('Failed to load profiles: ' + e.message, 'err'); }
}

function setStatus(text, kind = '') { $('status').className = 'status ' + kind; $('status').textContent = text; }

async function applyProfile(name, card) {
  if (state.busy) return;
  state.busy = true; card.classList.add('busy');
  setStatus(`Applying ${name}…`);
  try {
    const r = await postJson('/api/apply/' + encodeURIComponent(name));
    await loadProfiles();
    setStatus(`Applied ${name}.` + (r.warnings && r.warnings.length ? ' ' + r.warnings.join('; ') + '.' : '') + (r.audio === 'failed' ? ` Audio failed: ${r.audioError}` : ''),
      r.warnings && r.warnings.length ? '' : 'ok');
  } catch (e) { setStatus(`Apply failed: ${e.message}`, 'err'); }
  state.busy = false; card.classList.remove('busy');
}

async function deleteProfile(name) {
  if (!confirm(`Delete the profile "${name}"? This removes its saved layout and audio settings.`)) return;
  try { await api('/api/profiles/' + encodeURIComponent(name), { method: 'DELETE' }); await loadProfiles(); setStatus(`Deleted ${name}.`); }
  catch (e) { setStatus(e.message, 'err'); }
}

// ---------- audio devices ----------
$('devicesChev').append(icon('chevron', 'chev'));
function renderDevices() {
  const usedBy = (id) => state.profiles.filter((p) => p.audio && p.audio.device === id).map((p) => p.name);
  $('devices').replaceChildren(...state.devices.map((d) => {
    const users = usedBy(d.id);
    const btn = el('button', { type: 'button', class: 'btn ghost icon sm', 'aria-label': 'Copy device id', title: 'Copy device id', onclick: async () => {
      try { await navigator.clipboard.writeText(d.id); setStatus('Device id copied.', 'ok'); } catch (_) { prompt('Copy this ID:', d.id); }
    } }, icon('copy'));
    return el('div', { class: 'device' },
      el('div', { class: 'row between' },
        el('div', { class: 'grow' }, el('strong', {}, d.name), el('span', { class: 'muted' }, ` · ${d.deviceName}`), ' ',
          d.isDefault ? el('span', { class: 'badge secondary' }, 'default') : '', ' ',
          users.length ? el('span', { class: 'badge outline' }, 'used by ' + users.join(', ')) : ''),
        btn),
      el('div', { class: 'mono muted', style: 'margin-top:4px' }, d.id));
  }));
  if (!state.devices.length) $('devices').append(el('p', { class: 'muted' }, 'No playback devices found.'));
}

async function loadDevices() {
  try {
    const { devices } = await api('/api/audio-devices');
    $('liveDot').textContent = '· live';
    if (JSON.stringify(devices) !== JSON.stringify(state.devices) || !$('devices').children.length) { state.devices = devices; renderDevices(); }
  } catch (e) { $('liveDot').textContent = '· unavailable: ' + e.message; }
}

// ---------- audio dialog: spatial choices come from the selected device's own format list ----------
let editing = null;
function fillSpatial(deviceId, current) {
  const dev = state.devices.find((d) => d.id === deviceId);
  const names = dev ? dev.formats.map((f) => f.name) : [];
  const opts = [['off', 'Off'], ...names.map((n) => [n, n]), ['__custom', 'Other…']];
  $('dlgSpatial').replaceChildren(...opts.map(([v, t]) => el('option', { value: v }, t)));
  const cur = current || 'off';
  const known = opts.some(([v]) => v === cur) && cur !== '__custom';
  $('dlgSpatial').value = known ? cur : '__custom';
  $('dlgCustom').value = known ? '' : current;
  $('dlgCustom').hidden = $('dlgSpatial').value !== '__custom';
}
function openAudio(p) {
  editing = p;
  const cur = p.audio && !p.audio.error ? p.audio : {};
  $('dlgTitle').textContent = 'Audio for ' + p.name;
  $('dlgMsg').textContent = '';
  const opts = state.devices.map((d) => [d.id, `${d.name} · ${d.deviceName}`]);
  if (cur.device && !opts.some(([id]) => id === cur.device)) opts.unshift([cur.device, `${cur.label || cur.device} (not connected)`]);
  $('dlgDevice').replaceChildren(...opts.map(([v, t]) => el('option', { value: v }, t)));
  if (cur.device) $('dlgDevice').value = cur.device;
  fillSpatial($('dlgDevice').value, cur.spatial);
  $('dlgClear').hidden = !p.audio;
  $('audioDlg').showModal();
}
$('dlgDevice').addEventListener('change', () => fillSpatial($('dlgDevice').value, $('dlgSpatial').value === '__custom' ? $('dlgCustom').value : $('dlgSpatial').value));
$('dlgSpatial').addEventListener('change', () => { $('dlgCustom').hidden = $('dlgSpatial').value !== '__custom'; });
$('dlgCancel').addEventListener('click', () => $('audioDlg').close());
async function saveAudio(body, applyNow) {
  $('dlgMsg').textContent = '';
  try {
    await postJson('/api/audio-config/' + encodeURIComponent(editing.name), { ...body, applyNow });
    $('audioDlg').close();
    await loadProfiles();
  } catch (e) { $('dlgMsg').textContent = e.message; }
}
const dlgBody = () => {
  const sel = $('dlgDevice');
  const spatial = $('dlgSpatial').value === '__custom' ? $('dlgCustom').value : $('dlgSpatial').value;
  const label = sel.selectedOptions[0] ? sel.selectedOptions[0].textContent.split(' · ')[0].replace(' (not connected)', '') : '';
  return { device: sel.value, spatial, label };
};
$('dlgSave').addEventListener('click', () => saveAudio(dlgBody(), false));
$('dlgApply').addEventListener('click', () => saveAudio(dlgBody(), true));
$('dlgClear').addEventListener('click', () => saveAudio({ clear: true }, false));

// ---------- save the current layout / undo ----------
function openSave() {
  $('saveName').value = ''; $('saveMsg').textContent = ''; $('saveReplace').hidden = true;
  $('saveDlg').showModal(); $('saveName').focus();
}
async function saveLayout(overwrite) {
  const name = $('saveName').value.trim();
  $('saveMsg').textContent = '';
  try {
    const r = await postJson('/api/profiles/save', { name, overwrite });
    $('saveDlg').close();
    await loadProfiles();
    setStatus(`Saved “${r.name}” (${r.displays} display${r.displays === 1 ? '' : 's'}).`, 'ok');
  } catch (e) {
    $('saveMsg').textContent = e.message;
    $('saveReplace').hidden = !/already exists/i.test(e.message);
  }
}
$('saveLayoutBtn').addEventListener('click', openSave);
$('saveForm').addEventListener('submit', (ev) => { ev.preventDefault(); saveLayout(false); });
$('saveReplace').addEventListener('click', () => saveLayout(true));
$('saveCancel').addEventListener('click', () => $('saveDlg').close());
$('undoBtn').addEventListener('click', async () => {
  setStatus('Going back to the previous layout…');
  try { await postJson('/api/undo-layout'); await loadProfiles(); setStatus('Went back to the previous layout.', 'ok'); }
  catch (e) { setStatus(e.message, 'err'); }
});

// ---------- start ----------
$('saveLayoutBtn').prepend(icon('plus'));
$('newLayoutLink').prepend(icon('layout'));
$('undoBtn').prepend(icon('undo'));
renderShell('profiles').then((s) => {
  state.canEdit = !!(s && s.canEdit);
  $('newLayoutLink').hidden = !state.canEdit;
  if (state.profiles.length) renderProfiles(); // adds the Delete buttons once we know this is the PC itself
});
loadProfiles(); loadDevices();
setInterval(() => { if (!document.hidden) loadDevices(); }, 5000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { loadProfiles(); loadDevices(); } });
if (location.hash === '#save') openSave();
window.addEventListener('hashchange', () => { if (location.hash === '#save') openSave(); });
</script>
</body>
</html>
